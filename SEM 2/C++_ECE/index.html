<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C++ ECE Lab</title>

<style>
body {
    font-family: Arial;
    text-align: center;
    background: #f5f5f5;
}

h1 {
    margin-top: 40px;
}

.container {
    display: flex;
    justify-content: center;
    gap: 30px;
    margin-top: 50px;
}

.card {
    width: 220px;
    padding: 30px;
    border-radius: 15px;
    color: white;
    text-decoration: none;
    font-size: 20px;
    font-weight: bold;
    transition: 0.3s;
}

.card:hover {
    transform: scale(1.05);
}

.setA { background: linear-gradient(135deg,#ff416c,#ff4b2b); }
.setB { background: linear-gradient(135deg,#11998e,#38ef7d); }
.setC { background: linear-gradient(135deg,#6a11cb,#2975fc); }
.setK { background: linear-gradient(135deg,#6a61cb,#8575fc); }
html, body {
    overflow-x: hidden;
    width: 100%;
    max-width: 100vw;
}

@media (max-width: 600px) {
    body { padding-top: 36px; }
    h1 { font-size: 20px; margin-top: 20px; }
    .container { flex-wrap: wrap; gap: 14px; margin-top: 24px; padding: 0 16px; }
    .card { width: 100%; max-width: 280px; padding: 20px; font-size: 18px; box-sizing: border-box; }
    .aknex-hub-nav { top: 8px !important; right: 8px !important; }
    .aknex-hub-btn { padding: 5px 10px !important; font-size: 11px !important; }
}

        /* UNIVERSAL DARK THEME FOR SEM 2 */
        html[data-theme="dark"] body {
            background-color: #0b1120 !important;
            color: #e2e8f0 !important;
        }

        html[data-theme="dark"] h1,
        html[data-theme="dark"] h2,
        html[data-theme="dark"] h3,
        html[data-theme="dark"] h4,
        html[data-theme="dark"] .header,
        html[data-theme="dark"] .student-info,
        html[data-theme="dark"] .title {
            color: #f8fafc !important;
        }

        html[data-theme="dark"] table,
        html[data-theme="dark"] .main-table,
        html[data-theme="dark"] .output-table {
            background-color: #131d33 !important;
            border-color: #334155 !important;
            color: #e2e8f0 !important;
        }

        html[data-theme="dark"] th,
        html[data-theme="dark"] .main-table th {
            background-color: #1e293b !important;
            color: #f8fafc !important;
            border-color: #334155 !important;
        }

        html[data-theme="dark"] td,
        html[data-theme="dark"] .main-table td {
            border-color: #334155 !important;
            color: #cbd5e1 !important;
        }

        html[data-theme="dark"] .section-col {
            background-color: #18233c !important;
            color: #93c5fd !important;
        }

        html[data-theme="dark"] pre,
        html[data-theme="dark"] code {
            background-color: #090e1a !important;
            color: #38bdf8 !important;
            border-color: #1e293b !important;
        }

        html[data-theme="dark"] a {
            color: #60a5fa !important;
        }

        /* FLOATING THEME DOCK FOR SEM 2 */
        .sem2-theme-dock {
            position: fixed;
            top: 14px;
            right: 14px;
            z-index: 9999;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .theme-toggle-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #1e293b;
            color: #f1f5f9;
            border: 1px solid #334155;
            padding: 6px 13px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            user-select: none;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
            text-decoration: none;
        }

        .theme-toggle-btn:hover {
            background: #334155;
            border-color: #475569;
            transform: translateY(-1px);
        }

        html[data-theme="dark"] .theme-toggle-btn {
            background: #2563eb;
            color: #ffffff;
            border-color: #3b82f6;
        }

    
        /* SUBJECT FEEDBACK SYSTEM & FOOTER */
        .feedback-box {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 24px;
            margin: 40px auto 20px auto;
            max-width: 900px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
            box-sizing: border-box;
            text-align: left;
        }
        .feedback-box h3 {
            margin: 0 0 6px 0;
            font-size: 18px;
            color: #0f172a;
            font-weight: 700;
        }
        .feedback-box p {
            margin: 0 0 16px 0;
            font-size: 13.5px;
            color: #64748b;
            line-height: 1.5;
        }
        .star-rating-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
            background: #f8fafc;
            padding: 8px 14px;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            flex-wrap: wrap;
        }
        .rating-prompt {
            font-size: 13px;
            font-weight: 600;
            color: #475569;
        }
        .star-group {
            display: inline-flex;
            gap: 4px;
        }
        .star-btn {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: #cbd5e1;
            padding: 0 2px;
            line-height: 1;
            transition: color 0.15s ease, transform 0.15s ease;
        }
        .star-btn:hover {
            transform: scale(1.2);
        }
        .star-btn.active {
            color: #f59e0b;
        }
        .rating-badge {
            font-size: 12px;
            font-weight: 700;
            color: #d97706;
            background: #fef3c7;
            padding: 3px 8px;
            border-radius: 6px;
        }
        .feedback-box input,
        .feedback-box textarea {
            width: 100%;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 13.5px;
            font-family: inherit;
            box-sizing: border-box;
            margin-bottom: 12px;
            background: #ffffff;
            color: #0f172a;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .feedback-box textarea {
            min-height: 80px;
            resize: vertical;
        }
        .feedback-box input:focus,
        .feedback-box textarea:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }
        .btn-submit {
            background: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            font-size: 13.5px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        .btn-submit:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
        }
        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        #sub_msg {
            margin-top: 10px;
            font-size: 13px;
            font-weight: 600;
        }
        /* Dark theme support */
        html[data-theme="dark"] .feedback-box {
            background: #131d33 !important;
            border-color: #1e3a8a !important;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35) !important;
        }
        html[data-theme="dark"] .feedback-box h3 {
            color: #f8fafc !important;
        }
        html[data-theme="dark"] .feedback-box p {
            color: #94a3b8 !important;
        }
        html[data-theme="dark"] .star-rating-wrapper {
            background: #0f172a !important;
            border-color: #1e293b !important;
        }
        html[data-theme="dark"] .rating-prompt {
            color: #cbd5e1 !important;
        }
        html[data-theme="dark"] .feedback-box input,
        html[data-theme="dark"] .feedback-box textarea {
            background: #0f172a !important;
            border-color: #1e293b !important;
            color: #f8fafc !important;
        }
        html[data-theme="dark"] .feedback-box input:focus,
        html[data-theme="dark"] .feedback-box textarea:focus {
            border-color: #3b82f6 !important;
            background: #090e1a !important;
        }
        .bottom-footer, footer.bottom-footer, footer {
            text-align: center;
            padding: 24px 16px 36px 16px;
            margin-top: 20px;
            border-top: 1px solid #e2e8f0;
        }
        .bottom-footer p, footer p {
            margin: 0;
            font-size: 13.5px;
            color: #64748b;
        }
        .bottom-footer a, footer a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.15s ease;
        }
        .bottom-footer a:hover, footer a:hover {
            color: #1d4ed8;
            text-decoration: underline;
        }
        html[data-theme="dark"] .bottom-footer,
        html[data-theme="dark"] footer.bottom-footer,
        html[data-theme="dark"] footer {
            border-color: #1e293b !important;
        }
        html[data-theme="dark"] .bottom-footer p,
        html[data-theme="dark"] footer p {
            color: #64748b !important;
        }
        html[data-theme="dark"] .bottom-footer a,
        html[data-theme="dark"] footer a {
            color: #60a5fa !important;
        }

    </style>
    <script src="/theme.js"></script>
    <script src="/feedback.js"></script>
</head>

<body>
<!-- AKNEX BACK TO HUB BUTTON (RIGHT SIDE) -->
<div class="aknex-hub-nav" style="position: fixed; top: 16px; right: 16px; z-index: 999999; animation: aknexNavFadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);">
    <style>
        @keyframes aknexNavFadeIn {
            from { opacity: 0; transform: translateY(-8px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .aknex-hub-btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #ffffff !important;
            text-decoration: none !important;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 12.5px;
            font-weight: 700;
            padding: 8px 16px;
            border-radius: 999px;
            box-shadow: 0 4px 14px rgba(15, 23, 42, 0.35), 0 0 0 1px rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
        }
        .aknex-hub-btn:hover {
            transform: translateY(-2px) scale(1.04);
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.4), 0 0 0 1.5px #3b82f6;
            color: #ffffff !important;
        }
        .aknex-hub-btn:active {
            transform: translateY(0) scale(0.98);
        }
        .aknex-hub-btn .hub-arrow {
            display: inline-block;
            transition: transform 0.2s ease;
        }
        .aknex-hub-btn:hover .hub-arrow {
            transform: translateX(-3px);
        }
    </style>
    <a href="/" onclick="if(window.location.protocol==='file:'){this.href=window.location.pathname.match(/SET|MAIN/i)?'../../../index.html':'../../index.html';}" class="aknex-hub-btn">
        <span class="hub-arrow">←</span> <span>Back to Hub</span>
    </a>
</div>




<h1>📘 C++ ECE Lab</h1>
<p>Select a Set</p>

<div class="container">
    <a href="MAIN/" class="card setK">MAIN</a>
    <a href="SETA/" class="card setA">SET A</a>
    <a href="SETB/" class="card setB">SET B</a>
    <a href="SETC/" class="card setC">SET C</a>

</div>


    <!-- FLOATING THEME & HUB CONTROLS -->
    
        <!-- SUBJECT-SPECIFIC FEEDBACK SYSTEM -->
        <div class="feedback-box" id="subjectFeedbackBox">
            <h3>💬 Feedback & Requests for C++ ECE Lab Manual</h3>
            <p>Found an error, missing program code, or need a specific viva question for C++ ECE? Submit it here.</p>
            
            <div class="star-rating-wrapper">
                <span class="rating-prompt">Rate this Manual:</span>
                <div class="star-group" id="subStarGroup">
                    <button type="button" class="star-btn active" onclick="setSubjectRating(1)" title="1 Star">★</button>
                    <button type="button" class="star-btn active" onclick="setSubjectRating(2)" title="2 Stars">★</button>
                    <button type="button" class="star-btn active" onclick="setSubjectRating(3)" title="3 Stars">★</button>
                    <button type="button" class="star-btn active" onclick="setSubjectRating(4)" title="4 Stars">★</button>
                    <button type="button" class="star-btn active" onclick="setSubjectRating(5)" title="5 Stars">★</button>
                </div>
                <span class="rating-badge" id="subRatingBadge">5 ★ Excellent &amp; Exam Ready</span>
            </div>

            <input type="text" id="sub_name" placeholder="Your Name or Reg No (optional)">
            <textarea id="sub_feedback" placeholder="What needs to be added or corrected in C++ ECE? (e.g. Exp 4 graph, code explanation, viva Qs...)"></textarea>
            <button class="btn-submit" type="button" onclick="submitSubjectFeedback('C++ ECE Lab')">Submit Feedback</button>
            <p id="sub_msg"></p>
        </div>

        <!-- FOOTER -->
        <footer class="bottom-footer">
            <p><a href="https://aknex.vercel.app" target="_blank">Built by AKNEX</a></p>
        </footer>

    <div class="sem2-theme-dock">
        <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleSiteTheme()" title="Toggle Dark / Light Theme" aria-label="Toggle theme">
            <span class="theme-icon">🌙</span> <span class="theme-text">Dark</span>
        </button>
        <a href="/" class="theme-toggle-btn" style="background:#0f172a; border-color:rgba(255,255,255,0.2);">
            ← Hub
        </a>
    </div>

</body>
</html>
