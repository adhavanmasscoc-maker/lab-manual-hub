<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Linear Integrated Circuits Laboratory | EC5301 / EC3361</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #dde3eb;
            --surface: #edf2f7;
            --surface-card: #f8fafc;
            --border: #cbd5e1;
            --border-strong: #94a3b8;
            --text-main: #0f172a;
            --text-muted: #475569;
            --text-sub: #64748b;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --primary-light: rgba(37, 99, 235, 0.08);
            --accent-green: #059669;
            --accent-amber: #d97706;
            --shadow-sm: 0 2px 6px rgba(15, 23, 42, 0.04);
            --shadow-md: 0 4px 14px rgba(15, 23, 42, 0.08);
            --shadow-lg: 0 10px 25px -4px rgba(15, 23, 42, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100vh;
        }

        /* STICKY TOP BAR */
        .top-header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(237, 242, 247, 0.96);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 10px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            box-shadow: var(--shadow-sm);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-badge {
            background: #0f172a;
            color: #ffffff;
            font-family: 'Fira Code', monospace;
            font-size: 11px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 4px;
            letter-spacing: 0.04em;
        }

        .header-title {
            font-weight: 800;
            font-size: 14.5px;
            color: var(--text-main);
            letter-spacing: -0.01em;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #ffffff;
            text-decoration: none;
            font-size: 12px;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 3px 8px rgba(15, 23, 42, 0.2);
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            white-space: nowrap;
        }

        .btn-back:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 14px rgba(37, 99, 235, 0.35), 0 0 0 1.5px #3b82f6;
            color: #fff;
        }

        .jump-select {
            padding: 6px 10px;
            font-size: 12.5px;
            font-weight: 600;
            font-family: inherit;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: #ffffff;
            color: var(--text-main);
            outline: none;
            cursor: pointer;
            transition: border-color 0.2s, box-shadow 0.2s;
            max-width: 200px;
        }

        .jump-select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        /* NAVIGATION TABS & SEARCH */
        .nav-bar {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 10px 18px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
        }

        .tab-btn {
            font-family: inherit;
            font-size: 12.5px;
            font-weight: 600;
            padding: 6px 14px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: #ffffff;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
            white-space: nowrap;
        }

        .tab-btn:hover {
            background: #f1f5f9;
            color: var(--text-main);
            transform: translateY(-1px);
        }

        .tab-btn.active {
            background: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
            box-shadow: 0 2px 6px rgba(37, 99, 235, 0.25);
        }

        .search-input {
            flex: 1;
            min-width: 200px;
            padding: 6px 12px;
            font-size: 13px;
            font-family: inherit;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: #ffffff;
            color: var(--text-main);
            outline: none;
            transition: all 0.2s;
        }

        .search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        /* MAIN CONTAINER */
        main {
            max-width: 960px;
            margin: 20px auto 60px;
            padding: 0 16px;
        }

        /* BANNER */
        .manual-banner {
            background: var(--surface);
            border: 1px solid var(--border);
            border-left: 6px solid var(--primary);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-sm);
        }

        .manual-banner h1 {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 22px;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.02em;
            margin-bottom: 4px;
        }

        .manual-banner p {
            font-size: 13.5px;
            color: var(--text-muted);
        }

        /* EXPERIMENT CARD */
        article.exp-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-left: 5px solid var(--primary);
            border-radius: 10px;
            padding: 16px 20px 20px;
            margin-bottom: 22px;
            box-shadow: var(--shadow-sm);
            transition: box-shadow 0.2s ease, transform 0.2s ease;
        }

        article.exp-card:hover {
            box-shadow: var(--shadow-md);
        }

        .exp-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }

        .exp-badge {
            font-family: 'Fira Code', monospace;
            font-size: 11.5px;
            font-weight: 700;
            color: var(--primary);
            background: rgba(37, 99, 235, 0.1);
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid rgba(37, 99, 235, 0.2);
        }

        .exp-title {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 18px;
            font-weight: 800;
            color: var(--text-main);
            flex: 1;
            min-width: 250px;
        }

        .exp-ic-tag {
            font-family: 'Fira Code', monospace;
            font-size: 12px;
            font-weight: 700;
            background: #0f172a;
            color: #ffffff;
            padding: 3px 8px;
            border-radius: 4px;
        }

        /* DIRECT EXPANDED SECTIONS (ZERO CLICK TO VIEW) */
        .sec-block {
            border-top: 1px solid var(--border);
            padding: 14px 0 10px;
        }

        .sec-block:first-of-type {
            border-top: none;
            padding-top: 4px;
        }

        .sec-heading {
            font-size: 14px;
            font-weight: 700;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .section-body {
            padding: 4px 0 6px;
            font-size: 13.5px;
            color: var(--text-main);
        }

        /* ================= UNIVERSAL ASIDE QUICK-JUMP EXPERIMENT DOCK ================= */
        .exp-quick-dock {
            position: fixed;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 999;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(15, 23, 42, 0.94);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 12px;
            padding: 8px 6px;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.3);
            max-height: 85vh;
            transition: all 0.25s ease;
        }

        .exp-quick-dock .dock-header {
            display: flex;
            align-items: center;
            gap: 4px;
            padding-bottom: 6px;
            margin-bottom: 4px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            font-size: 10px;
            font-weight: 800;
            color: #94a3b8;
            letter-spacing: 0.05em;
        }

        .exp-quick-dock .dock-badge {
            background: #2563eb;
            color: #fff;
            font-size: 9px;
            padding: 1px 5px;
            border-radius: 4px;
        }

        .exp-quick-dock .dock-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 4px;
            overflow-y: auto;
            max-height: calc(85vh - 75px);
            padding: 2px;
            scrollbar-width: none;
        }
        .exp-quick-dock .dock-grid::-webkit-scrollbar {
            display: none;
        }

        .dock-box-btn {
            width: 28px;
            height: 28px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-family: 'Fira Code', monospace;
            font-size: 11.5px;
            font-weight: 700;
            color: #cbd5e1;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .dock-box-btn:hover {
            background: #2563eb;
            color: #ffffff;
            border-color: #60a5fa;
            transform: scale(1.08);
        }

        .dock-box-btn.active {
            background: #2563eb;
            color: #ffffff;
            border-color: #93c5fd;
            box-shadow: 0 0 10px rgba(37, 99, 235, 0.7);
            font-weight: 800;
        }

        .exp-quick-dock .dock-footer {
            margin-top: 4px;
            padding-top: 4px;
            border-top: 1px solid rgba(255, 255, 255, 0.12);
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .dock-top-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 4px;
            transition: color 0.15s;
        }

        .dock-top-btn:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.1);
        }

        /* Mobile Quick Bar / Drawer */
        .mobile-exp-pill {
            display: none;
            position: fixed;
            bottom: 16px;
            right: 16px;
            z-index: 1000;
            background: #0f172a;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 999px;
            padding: 8px 14px;
            font-size: 12px;
            font-weight: 700;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
            cursor: pointer;
            align-items: center;
            gap: 6px;
        }

        @media (max-width: 900px) {
            .exp-quick-dock {
                right: 8px;
            }
        }

        @media (max-width: 768px) {
            .exp-quick-dock {
                display: none;
            }
            .exp-quick-dock.mobile-open {
                display: flex;
                right: 16px;
                bottom: 60px;
                top: auto;
                transform: none;
                z-index: 1001;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            }
            .mobile-exp-pill {
                display: flex;
            }
        }

        /* TABLES */
        .table-wrap {
            overflow-x: auto;
            margin: 8px 0;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: #ffffff;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            font-size: 12.5px;
            text-align: left;
        }

        th, td {
            border: 1px solid var(--border);
            padding: 8px 12px;
            min-width: 70px;
        }

        th {
            background: #f1f5f9;
            color: var(--text-main);
            font-weight: 700;
        }

        td[contenteditable="true"] {
            background: #fff;
            outline: none;
            transition: background 0.15s;
        }

        td[contenteditable="true"]:focus {
            background: #eff6ff;
            box-shadow: inset 0 0 0 2px var(--primary);
        }

        /* FORMULAS & CODE */
        .formula-box, .code-box {
            font-family: 'Fira Code', monospace;
            font-size: 12.5px;
            background: #0f172a;
            color: #38bdf8;
            padding: 10px 14px;
            border-radius: 6px;
            margin: 6px 0;
            overflow-x: auto;
            border: 1px solid #1e293b;
        }

        .formula-box span.var {
            color: #f43f5e;
        }

        .formula-box span.val {
            color: #34d399;
        }

        /* SVG DIAGRAMS */
        .diagram-container {
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            margin: 10px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: inset 0 1px 3px rgba(15, 23, 42, 0.02);
        }

        svg {
            width: 100%;
            max-width: 580px;
            height: auto;
            display: block;
            color: var(--text-main);
            cursor: zoom-in;
            transition: transform 0.15s;
        }

        svg:hover {
            transform: scale(1.01);
        }

        svg * {
            stroke: currentColor;
            fill: none;
            stroke-width: 1.6;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        svg text {
            fill: currentColor;
            stroke: none;
            font-family: 'Inter', -apple-system, sans-serif;
            font-size: 11px;
            font-weight: 500;
        }

        .diagram-caption {
            font-size: 11.5px;
            color: var(--text-sub);
            margin-top: 8px;
            text-align: center;
        }

        /* PROCEDURE LIST */
        ol.proc-list, ul.proc-list {
            padding-left: 20px;
            margin: 6px 0;
        }

        ol.proc-list li, ul.proc-list li {
            margin-bottom: 6px;
            line-height: 1.5;
        }

        /* VIVA QA (DIRECT VIEW - NO CLICK TO SEE) */
        .viva-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 8px 0;
        }

        .viva-item {
            background: #ffffff;
            border: 1px solid var(--border);
            border-left: 4px solid var(--primary);
            border-radius: 6px;
            padding: 10px 14px;
        }

        .viva-q {
            font-weight: 700;
            color: var(--text-main);
            font-size: 13px;
            margin-bottom: 4px;
        }

        .viva-a {
            color: #0f766e;
            font-size: 13px;
            line-height: 1.45;
        }

        .viva-key {
            display: inline-block;
            font-size: 11px;
            font-weight: 700;
            color: var(--accent-amber);
            background: #fffbeb;
            border: 1px solid #fde68a;
            padding: 2px 7px;
            border-radius: 4px;
            margin-top: 4px;
        }

        /* CHECKLIST IN EXAM MODE */
        .checklist-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 0;
            font-size: 13px;
            border-bottom: 1px dashed var(--border);
        }

        .checklist-item input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        /* LIGHTBOX */
        #lightbox {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(6px);
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 2000;
            cursor: zoom-out;
        }

        #lightbox-content {
            background: #ffffff;
            border-radius: 12px;
            padding: 24px;
            max-width: 90vw;
            max-height: 90vh;
            overflow: auto;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        #lightbox-content svg {
            max-width: 820px;
            width: 100%;
        }

        /* FOOTER */
        footer {
            text-align: center;
            font-size: 13px;
            color: var(--text-sub);
            padding: 20px 0;
            border-top: 1px solid var(--border);
            margin-top: 40px;
        }

        footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
        }

        @media (max-width: 640px) {
            .top-header {
                padding: 8px 12px;
            }
            .header-title span.full-title {
                display: none;
            }
            .nav-bar {
                padding: 8px 12px;
            }
            main {
                padding: 0 10px;
            }
            article.exp-card {
                padding: 14px;
            }
            .exp-title {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <!-- STICKY TOP BAR -->
    <header class="top-header">
        <div class="header-left">
            <span class="brand-badge">LIC LAB</span>
            <div class="header-title">
                <span>EC5301 / EC3361</span>
                <span class="full-title" style="color:var(--text-muted); font-weight:600;">· Linear Integrated Circuits</span>
            </div>
        </div>
        <div class="header-right">
            <select id="jump-select" class="jump-select" onchange="jumpTo(this.value)">
                <option value="">Jump to Experiment...</option>
                <option value="e1">Exp 1: Inverting & Non-Inverting Amp</option>
                <option value="e2">Exp 2: Precision Rectifiers</option>
                <option value="e3">Exp 3: Function Generator</option>
                <option value="e4">Exp 4: Active Clipper</option>
                <option value="e5">Exp 5: RC Phase Shift & Wein Bridge</option>
                <option value="e6">Exp 6: 2nd Order Active Filters</option>
                <option value="e7">Exp 7: PLL using IC565</option>
                <option value="e8">Exp 8: 4-bit R-2R Ladder DAC</option>
                <option value="e9">Exp 9: Instrumentation Amplifier</option>
                <option value="e10">Exp 10: Square Wave Generator</option>
                <option value="e11">Exp 11: Voltage Regulator IC723</option>
            </select>
            <a href="../../index.html" class="btn-back">
                <span class="hub-arrow">←</span> Back to Hub
            </a>
        </div>
    </header>

    <!-- NAVIGATION TABS & SEARCH -->
    <nav class="nav-bar">
        <button class="tab-btn active" data-v="exp">All Experiments (11)</button>
        <button class="tab-btn" data-v="exam">Exam Day Checklist</button>
        <button class="tab-btn" data-v="viva">Viva Voce Bank</button>
        <button class="tab-btn" data-v="formula">Formula Bank</button>
        <button class="tab-btn" data-v="ic">IC Pinouts & Specs</button>
        <button class="tab-btn" data-v="rev">Quick Revision</button>
        <input type="search" id="search" class="search-input" placeholder="Search (741, gain, filter, R-2R, PLL, slew rate)..." aria-label="Search">
    </nav>

    <!-- MAIN VIEW CONTAINER -->
    <main id="app-container">
        <!-- Content injected dynamically -->
    </main>

    <!-- UNIVERSAL ASIDE QUICK-JUMP EXPERIMENT DOCK (11 EXPERIMENTS) -->
    <aside class="exp-quick-dock" id="expQuickDock" aria-label="Quick Jump to Experiment">
        <div class="dock-header">
            <span class="dock-title">EXPS</span>
            <span class="dock-badge">11</span>
        </div>
        <div class="dock-grid">
            <button class="dock-box-btn" onclick="jumpTo('e1')" data-exp="1" title="Exp 1: Inverting & Non-Inverting Amp">1</button>
            <button class="dock-box-btn" onclick="jumpTo('e2')" data-exp="2" title="Exp 2: Precision Rectifiers">2</button>
            <button class="dock-box-btn" onclick="jumpTo('e3')" data-exp="3" title="Exp 3: Function Generator">3</button>
            <button class="dock-box-btn" onclick="jumpTo('e4')" data-exp="4" title="Exp 4: Active Clipper">4</button>
            <button class="dock-box-btn" onclick="jumpTo('e5')" data-exp="5" title="Exp 5: RC Phase Shift & Wein Bridge">5</button>
            <button class="dock-box-btn" onclick="jumpTo('e6')" data-exp="6" title="Exp 6: 2nd Order Active Filters">6</button>
            <button class="dock-box-btn" onclick="jumpTo('e7')" data-exp="7" title="Exp 7: PLL using IC565">7</button>
            <button class="dock-box-btn" onclick="jumpTo('e8')" data-exp="8" title="Exp 8: 4-bit R-2R Ladder DAC">8</button>
            <button class="dock-box-btn" onclick="jumpTo('e9')" data-exp="9" title="Exp 9: Instrumentation Amplifier">9</button>
            <button class="dock-box-btn" onclick="jumpTo('e10')" data-exp="10" title="Exp 10: Square Wave Generator">10</button>
            <button class="dock-box-btn" onclick="jumpTo('e11')" data-exp="11" title="Exp 11: Voltage Regulator IC723">11</button>
        </div>
        <div class="dock-footer">
            <button class="dock-top-btn" onclick="window.scrollTo({top:0, behavior:'smooth'})" title="Top">↑ Top</button>
        </div>
    </aside>

    <button class="mobile-exp-pill" id="mobileExpPill" onclick="toggleMobileExpDock()" aria-label="Toggle Experiment Navigator">
        ⚡ Exp <span id="mobileCurrExp">1</span>/11
    </button>

    <!-- LIGHTBOX MODAL FOR ZOOMING DIAGRAMS -->
    <div id="lightbox" onclick="closeLightbox()">
        <div id="lightbox-content" onclick="event.stopPropagation()"></div>
    </div>

    <footer>
        <p>Chennai Institute of Technology · Department of ECE · Built for Fast Lab Exam Success</p>
    </footer>

    <script>
    // ==========================================
    // MATHEMATICALLY PRECISE SVG SCHEMATICS
    // ==========================================
    const sv = (b, w=480, h=180) => `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="circuit diagram">${b}</svg>`;
    const T = (x, y, t, anchor="start", cls="") => `<text x="${x}" y="${y}" text-anchor="${anchor}" class="${cls}">${t}</text>`;

    const appContainer = document.getElementById('app-container');

    function setView(viewName) {
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.v === viewName);
        });
        if (V[viewName]) {
            appContainer.innerHTML = V[viewName]();
        }
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function jumpTo(id) {
        if (!id) return;
        setView('exp');
        setTimeout(() => {
            const el = document.getElementById(id);
            if (el) {
                el.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }, 100);
    }

    function searchExperiments(query) {
        query = query.toLowerCase().trim();
        if (!query) {
            setView('exp');
            return;
        }

        const matches = E.filter(e => {
            const blob = (e.t + ' ' + e.aim + ' ' + e.ic + ' ' + e.theory + ' ' + e.f.join(' ') + ' ' + e.viva.map(v => v[0] + ' ' + v[1]).join(' ')).toLowerCase();
            return blob.includes(query);
        });

        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

        if (matches.length === 0) {
            appContainer.innerHTML = `
                <div class="manual-banner">
                    <h2>No Matching Experiments</h2>
                    <p>No results found for “${query}”. Try searching for an IC number (741, 565, 723), component, or concept.</p>
                </div>
            `;
        } else {
            appContainer.innerHTML = `
                <div class="manual-banner">
                    <h2>Search Results</h2>
                    <p>${matches.length} experiment(s) match “${query}”.</p>
                </div>
                ${matches.map(renderExp).join('')}
            `;
        }

    appContainer.addEventListener('click', e => {
        const svgEl = e.target.closest('svg');
        if (svgEl && !e.target.closest('#lightbox')) {
            openLightbox(svgEl.outerHTML);
        }
    });

    // Initialize default view
    setView('exp');

    // ==========================================
    // UNIVERSAL ASIDE DOCK SCROLLSPY & MOBILE CONTROLS
    // ==========================================
    function toggleMobileExpDock() {
        const dock = document.getElementById('expQuickDock');
        if (dock) {
            dock.classList.toggle('mobile-open');
        }
    }

    function initScrollSpy() {
        const dock = document.getElementById('expQuickDock');
        if (!dock) return;
        const buttons = dock.querySelectorAll('.dock-box-btn');
        const cards = document.querySelectorAll('article.exp-card');
        if (!cards.length) return;

        const observer = new IntersectionObserver(entries => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const id = entry.target.id; // e.g. "e1"
                    const num = id.replace('e', '');
                    buttons.forEach(btn => {
                        if (btn.getAttribute('data-exp') === num) {
                            btn.classList.add('active');
                            const pill = document.getElementById('mobileCurrExp');
                            if (pill) pill.textContent = num;
                        } else {
                            btn.classList.remove('active');
                        }
                    });
                }
            });
        }, { threshold: 0.15, rootMargin: '-60px 0px -40% 0px' });

        cards.forEach(card => observer.observe(card));
    }

    // Re-attach scrollspy after rendering
    setTimeout(initScrollSpy, 300);
    </script>
</body>
</html>
