<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Linear Integrated Circuits Laboratory | EC5301 / EC3361</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #dde3eb;
            --surface: #edf2f7;
            --surface-card: #f8fafc;
            --border: #cbd5e1;
            --border-strong: #94a3b8;
            --text-main: #0f172a;
            --text-muted: #475569;
            --text-sub: #64748b;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --primary-light: rgba(37, 99, 235, 0.08);
            --accent-green: #059669;
            --accent-amber: #d97706;
            --shadow-sm: 0 2px 6px rgba(15, 23, 42, 0.04);
            --shadow-md: 0 4px 14px rgba(15, 23, 42, 0.08);
            --shadow-lg: 0 10px 25px -4px rgba(15, 23, 42, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100vh;
        }

        /* STICKY TOP BAR */
        .top-header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(237, 242, 247, 0.96);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 10px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            box-shadow: var(--shadow-sm);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-badge {
            background: #0f172a;
            color: #ffffff;
            font-family: 'Fira Code', monospace;
            font-size: 11px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 4px;
            letter-spacing: 0.04em;
        }

        .header-title {
            font-weight: 800;
            font-size: 14.5px;
            color: var(--text-main);
            letter-spacing: -0.01em;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #ffffff;
            text-decoration: none;
            font-size: 12px;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 3px 8px rgba(15, 23, 42, 0.2);
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            white-space: nowrap;
        }

        .btn-back:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 14px rgba(37, 99, 235, 0.35), 0 0 0 1.5px #3b82f6;
            color: #fff;
        }

        .jump-select {
            padding: 6px 10px;
            font-size: 12.5px;
            font-weight: 600;
            font-family: inherit;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: #ffffff;
            color: var(--text-main);
            outline: none;
            cursor: pointer;
            transition: border-color 0.2s, box-shadow 0.2s;
            max-width: 200px;
        }

        .jump-select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        /* NAVIGATION TABS & SEARCH */
        .nav-bar {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 10px 18px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
        }

        .tab-btn {
            font-family: inherit;
            font-size: 12.5px;
            font-weight: 600;
            padding: 6px 14px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: #ffffff;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
            white-space: nowrap;
        }

        .tab-btn:hover {
            background: #f1f5f9;
            color: var(--text-main);
            transform: translateY(-1px);
        }

        .tab-btn.active {
            background: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
            box-shadow: 0 2px 6px rgba(37, 99, 235, 0.25);
        }

        .search-input {
            flex: 1;
            min-width: 200px;
            padding: 6px 12px;
            font-size: 13px;
            font-family: inherit;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: #ffffff;
            color: var(--text-main);
            outline: none;
            transition: all 0.2s;
        }

        .search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        /* MAIN CONTAINER */
        main {
            max-width: 960px;
            margin: 20px auto 60px;
            padding: 0 16px;
        }

        /* BANNER */
        .manual-banner {
            background: var(--surface);
            border: 1px solid var(--border);
            border-left: 6px solid var(--primary);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-sm);
        }

        .manual-banner h1 {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 22px;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.02em;
            margin-bottom: 4px;
        }

        .manual-banner p {
            font-size: 13.5px;
            color: var(--text-muted);
        }

        /* EXPERIMENT CARD */
        article.exp-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-left: 5px solid var(--primary);
            border-radius: 10px;
            padding: 16px 20px 20px;
            margin-bottom: 22px;
            box-shadow: var(--shadow-sm);
            transition: box-shadow 0.2s ease, transform 0.2s ease;
        }

        article.exp-card:hover {
            box-shadow: var(--shadow-md);
        }

        .exp-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }

        .exp-badge {
            font-family: 'Fira Code', monospace;
            font-size: 11.5px;
            font-weight: 700;
            color: var(--primary);
            background: rgba(37, 99, 235, 0.1);
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid rgba(37, 99, 235, 0.2);
        }

        .exp-title {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 18px;
            font-weight: 800;
            color: var(--text-main);
            flex: 1;
            min-width: 250px;
        }

        .exp-ic-tag {
            font-family: 'Fira Code', monospace;
            font-size: 12px;
            font-weight: 700;
            background: #0f172a;
            color: #ffffff;
            padding: 3px 8px;
            border-radius: 4px;
        }

        /* DIRECT EXPANDED SECTIONS (ZERO CLICK TO VIEW) */
        .sec-block {
            border-top: 1px solid var(--border);
            padding: 14px 0 10px;
        }

        .sec-block:first-of-type {
            border-top: none;
            padding-top: 4px;
        }

        .sec-heading {
            font-size: 14px;
            font-weight: 700;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .section-body {
            padding: 4px 0 6px;
            font-size: 13.5px;
            color: var(--text-main);
        }

        /* ================= UNIVERSAL ASIDE QUICK-JUMP EXPERIMENT DOCK ================= */
        .exp-quick-dock {
            position: fixed;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 999;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(15, 23, 42, 0.94);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 12px;
            padding: 8px 6px;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.3);
            max-height: 85vh;
            transition: all 0.25s ease;
        }

        .exp-quick-dock .dock-header {
            display: flex;
            align-items: center;
            gap: 4px;
            padding-bottom: 6px;
            margin-bottom: 4px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            font-size: 10px;
            font-weight: 800;
            color: #94a3b8;
            letter-spacing: 0.05em;
        }

        .exp-quick-dock .dock-badge {
            background: #2563eb;
            color: #fff;
            font-size: 9px;
            padding: 1px 5px;
            border-radius: 4px;
        }

        .exp-quick-dock .dock-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 4px;
            overflow-y: auto;
            max-height: calc(85vh - 75px);
            padding: 2px;
            scrollbar-width: none;
        }
        .exp-quick-dock .dock-grid::-webkit-scrollbar {
            display: none;
        }

        .dock-box-btn {
            width: 28px;
            height: 28px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-family: 'Fira Code', monospace;
            font-size: 11.5px;
            font-weight: 700;
            color: #cbd5e1;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .dock-box-btn:hover {
            background: #2563eb;
            color: #ffffff;
            border-color: #60a5fa;
            transform: scale(1.08);
        }

        .dock-box-btn.active {
            background: #2563eb;
            color: #ffffff;
            border-color: #93c5fd;
            box-shadow: 0 0 10px rgba(37, 99, 235, 0.7);
            font-weight: 800;
        }

        .exp-quick-dock .dock-footer {
            margin-top: 4px;
            padding-top: 4px;
            border-top: 1px solid rgba(255, 255, 255, 0.12);
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .dock-top-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 4px;
            transition: color 0.15s;
        }

        .dock-top-btn:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.1);
        }

        /* Mobile Quick Bar / Drawer */
        .mobile-exp-pill {
            display: none;
            position: fixed;
            bottom: 16px;
            right: 16px;
            z-index: 1000;
            background: #0f172a;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 999px;
            padding: 8px 14px;
            font-size: 12px;
            font-weight: 700;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
            cursor: pointer;
            align-items: center;
            gap: 6px;
        }

        @media (max-width: 900px) {
            .exp-quick-dock {
                right: 8px;
            }
        }

        @media (max-width: 768px) {
            .exp-quick-dock {
                display: none;
            }
            .exp-quick-dock.mobile-open {
                display: flex;
                right: 16px;
                bottom: 60px;
                top: auto;
                transform: none;
                z-index: 1001;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            }
            .mobile-exp-pill {
                display: flex;
            }
        }

        /* TABLES */
        .table-wrap {
            overflow-x: auto;
            margin: 8px 0;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: #ffffff;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            font-size: 12.5px;
            text-align: left;
        }

        th, td {
            border: 1px solid var(--border);
            padding: 8px 12px;
            min-width: 70px;
        }

        th {
            background: #f1f5f9;
            color: var(--text-main);
            font-weight: 700;
        }

        td[contenteditable="true"] {
            background: #fff;
            outline: none;
            transition: background 0.15s;
        }

        td[contenteditable="true"]:focus {
            background: #eff6ff;
            box-shadow: inset 0 0 0 2px var(--primary);
        }

        /* FORMULAS & CODE */
        .formula-box, .code-box {
            font-family: 'Fira Code', monospace;
            font-size: 12.5px;
            background: #0f172a;
            color: #38bdf8;
            padding: 10px 14px;
            border-radius: 6px;
            margin: 6px 0;
            overflow-x: auto;
            border: 1px solid #1e293b;
        }

        .formula-box span.var {
            color: #f43f5e;
        }

        .formula-box span.val {
            color: #34d399;
        }

        /* SVG DIAGRAMS */
        .diagram-container {
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            margin: 10px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: inset 0 1px 3px rgba(15, 23, 42, 0.02);
        }

        svg {
            width: 100%;
            max-width: 580px;
            height: auto;
            display: block;
            color: var(--text-main);
            cursor: zoom-in;
            transition: transform 0.15s;
        }

        svg:hover {
            transform: scale(1.01);
        }

        svg * {
            stroke: currentColor;
            fill: none;
            stroke-width: 1.6;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        svg text {
            fill: currentColor;
            stroke: none;
            font-family: 'Inter', -apple-system, sans-serif;
            font-size: 11px;
            font-weight: 500;
        }

        .diagram-caption {
            font-size: 11.5px;
            color: var(--text-sub);
            margin-top: 8px;
            text-align: center;
        }

        /* PROCEDURE LIST */
        ol.proc-list, ul.proc-list {
            padding-left: 20px;
            margin: 6px 0;
        }

        ol.proc-list li, ul.proc-list li {
            margin-bottom: 6px;
            line-height: 1.5;
        }

        /* VIVA QA (DIRECT VIEW - NO CLICK TO SEE) */
        .viva-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 8px 0;
        }

        .viva-item {
            background: #ffffff;
            border: 1px solid var(--border);
            border-left: 4px solid var(--primary);
            border-radius: 6px;
            padding: 10px 14px;
        }

        .viva-q {
            font-weight: 700;
            color: var(--text-main);
            font-size: 13px;
            margin-bottom: 4px;
        }

        .viva-a {
            color: #0f766e;
            font-size: 13px;
            line-height: 1.45;
        }

        .viva-key {
            display: inline-block;
            font-size: 11px;
            font-weight: 700;
            color: var(--accent-amber);
            background: #fffbeb;
            border: 1px solid #fde68a;
            padding: 2px 7px;
            border-radius: 4px;
            margin-top: 4px;
        }

        /* CHECKLIST IN EXAM MODE */
        .checklist-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 0;
            font-size: 13px;
            border-bottom: 1px dashed var(--border);
        }

        .checklist-item input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        /* LIC DIAGRAM & GRAPH CARDS */
        .lic-diagram-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 16px;
            margin: 10px 0 16px;
        }

        .lic-diagram-card {
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.2s ease;
        }

        .lic-diagram-card:hover {
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.1);
            border-color: rgba(37, 99, 235, 0.3);
        }

        .lic-diagram-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            line-height: 1.35;
        }

        .lic-diagram-img-wrap {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 170px;
            overflow: hidden;
            cursor: zoom-in;
        }

        .lic-diagram-card img {
            max-width: 100%;
            height: auto;
            max-height: 260px;
            object-fit: contain;
            border-radius: 4px;
            transition: transform 0.2s ease;
        }

        .lic-diagram-card img:hover {
            transform: scale(1.02);
        }

        .lic-diagram-desc {
            font-size: 11.5px;
            color: var(--text-muted);
            margin-top: 10px;
            line-height: 1.4;
            font-style: italic;
        }

        .zoom-hint {
            display: inline-block;
            font-size: 10.5px;
            font-weight: 600;
            color: var(--primary);
            background: rgba(37, 99, 235, 0.08);
            padding: 2px 6px;
            border-radius: 4px;
            margin-top: 4px;
        }

        /* LIGHTBOX */
        #lightbox {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(6px);
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 2000;
            cursor: zoom-out;
        }

        #lightbox-content {
            background: #ffffff;
            border-radius: 12px;
            padding: 24px;
            max-width: 90vw;
            max-height: 90vh;
            overflow: auto;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        #lightbox-content svg {
            max-width: 820px;
            width: 100%;
        }

        /* FOOTER */
        footer {
            text-align: center;
            font-size: 13px;
            color: var(--text-sub);
            padding: 20px 0;
            border-top: 1px solid var(--border);
            margin-top: 40px;
        }

        footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
        }

        @media (max-width: 640px) {
            .top-header {
                padding: 8px 12px;
            }
            .header-title span.full-title {
                display: none;
            }
            .nav-bar {
                padding: 8px 12px;
            }
            main {
                padding: 0 10px;
            }
            article.exp-card {
                padding: 14px;
            }
            .exp-title {
                font-size: 16px;
            }
        }

        /* THEME TOGGLE BUTTON */
        .theme-toggle-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #1e293b;
            color: #f1f5f9;
            border: 1px solid #334155;
            padding: 6px 13px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            user-select: none;
            box-shadow: 0 2px 6px rgba(15, 23, 42, 0.15);
        }

        .theme-toggle-btn:hover {
            background: #334155;
            border-color: #475569;
            transform: translateY(-1px);
        }

        /* COMPREHENSIVE DARK THEME SYSTEM */
        html[data-theme="dark"],
        :root[data-theme="dark"] {
            --bg: #0b1120;
            --surface: #111a2e;
            --surface-card: #18233c;
            --border: #1e293b;
            --border-strong: #334155;
            --text-main: #f8fafc;
            --text-muted: #cbd5e1;
            --text-sub: #94a3b8;
            --primary: #3b82f6;
            --primary-hover: #60a5fa;
            --primary-light: rgba(59, 130, 246, 0.15);
            --accent-green: #10b981;
            --accent-amber: #fbbf24;
            --shadow-sm: 0 2px 6px rgba(0, 0, 0, 0.35);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.45);
            --shadow-lg: 0 10px 28px -4px rgba(0, 0, 0, 0.6);
        }

        html[data-theme="dark"] .top-header {
            background: rgba(15, 23, 42, 0.96);
            border-bottom-color: #1e293b;
        }

        html[data-theme="dark"] .jump-select {
            background: #18233c;
            border-color: #334155;
            color: #f8fafc;
        }

        html[data-theme="dark"] .theme-toggle-btn {
            background: #2563eb;
            color: #ffffff;
            border-color: #3b82f6;
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.4);
        }

        html[data-theme="dark"] .lic-diagram-card {
            background: #131d33;
            border-color: #1e293b;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
        }

        html[data-theme="dark"] .lic-diagram-img-wrap {
            background: #ffffff;
            border-color: #334155;
        }

        html[data-theme="dark"] .nav-bar {
            background: #111a2e;
            border-bottom-color: #1e293b;
        }

        html[data-theme="dark"] .tab-btn {
            background: #18233c;
            border-color: #1e293b;
            color: #cbd5e1;
        }

        html[data-theme="dark"] .tab-btn:hover {
            background: #1e293b;
            color: #ffffff;
        }

    <script>
    // ==========================================
    // MATHEMATICALLY PRECISE SVG SCHEMATICS
    // ==========================================
    const sv = (b, w=480, h=180) => `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="circuit diagram">${b}</svg>`;
    const T = (x, y, t, anchor="start", cls="") => `<text x="${x}" y="${y}" text-anchor="${anchor}" class="${cls}">${t}</text>`;
    const DOT = (x, y) => `<circle cx="${x}" cy="${y}" r="3.5" fill="currentColor"/>`;
    const GND = (x, y) => `<path d="M${x} ${y}v10M${x-10} ${y+10}h20M${x-6} ${y+14}h12M${x-2} ${y+18}h4"/>`;
    const Rz = (x, y, w=40, h=16, label="") => `<rect x="${x}" y="${y-h/2}" width="${w}" height="${h}" rx="2" fill="var(--surface-card)"/><text x="${x+w/2}" y="${y-h/2-4}" text-anchor="middle" font-size="11" font-weight="600">${label}</text>`;
    
    // Op-Amp triangle with clearly defined pins
    // Triangle: (x, y) to (x, y+60) to (x+50, y+30)
    // Pin 2 (-) at (x, y+18)
    // Pin 3 (+) at (x, y+42)
    // Output Pin 6 at (x+50, y+30)
    const OA = (x, y, name="741") => `
        <path d="M${x} ${y} v60 l55 -30 z" fill="var(--surface-card)" stroke-width="1.8"/>
        <text x="${x+6}" y="${y+22}" font-size="14" font-weight="bold">−</text>
        <text x="${x+6}" y="${y+46}" font-size="14" font-weight="bold">+</text>
        <text x="${x+20}" y="${y+34}" font-size="11" font-weight="700">${name}</text>
    `;

    // Block diagram chain builder with proper spacing and markers
    const chain = a => {
        const n = a.length, w = Math.floor(440 / n);
        let s = `
            <defs>
                <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 1 L 10 5 L 0 9 z" fill="currentColor"/>
                </marker>
            </defs>
        `;
        a.forEach((t, i) => {
            const x = 20 + i * w;
            s += `<rect x="${x}" y="50" width="${w-18}" height="55" rx="6" fill="var(--surface-card)" stroke-width="1.5"/>`;
            const lines = t.split('|');
            lines.forEach((l, j) => {
                s += `<text x="${x + (w-18)/2}" y="${72 + j*14}" text-anchor="middle" font-size="11" font-weight="600">${l}</text>`;
            });
            if (i < n - 1) {
                s += `<line x1="${x + w - 18}" y1="77" x2="${x + w}" y2="77" stroke-width="1.6" marker-end="url(#arrow)"/>`;
            }
        });
        return sv(s, 480, 150);
    };

    // 1. INVERTING AMPLIFIER SCHEMATIC
    const INV_SVG = sv(`
        ${OA(230, 60)}
        <!-- Input wire & R1 -->
        <circle cx="40" cy="78" r="3" fill="currentColor"/>
        <text x="32" y="82" font-size="12" font-weight="bold">Vi</text>
        <path d="M40 78 h60"/>
        ${Rz(100, 78, 50, 18, "R1 = 1 kΩ")}
        <path d="M150 78 h80"/>
        ${DOT(190, 78)}
        <!-- Pin 3 (+) to Ground -->
        <path d="M230 102 h-30 v25"/>
        ${GND(200, 127)}
        <!-- Feedback Loop Rf -->
        <path d="M190 78 v-42 h25"/>
        ${Rz(215, 36, 60, 18, "Rf = 10 kΩ")}
        <path d="M275 36 h60 v54"/>
        ${DOT(335, 90)}
        <!-- Output wire -->
        <path d="M285 90 h130"/>
        <circle cx="415" cy="90" r="3" fill="currentColor"/>
        <text x="425" y="94" font-size="12" font-weight="bold">Vo</text>
        <!-- Formula text -->
        <text x="240" y="160" text-anchor="middle" font-size="12" font-weight="600" fill="var(--primary)">Inverting: Vo = −(Rf / R1) · Vi = −10 · Vi  (180° Phase Shift)</text>
    `, 480, 175);

    // 2. NON-INVERTING AMPLIFIER SCHEMATIC
    const NON_SVG = sv(`
        ${OA(230, 60)}
        <!-- Input wire directly to Pin 3 (+) -->
        <circle cx="40" cy="102" r="3" fill="currentColor"/>
        <text x="32" y="106" font-size="12" font-weight="bold">Vi</text>
        <path d="M40 102 h190"/>
        <!-- Feedback divider to Pin 2 (-) -->
        <path d="M230 78 h-45"/>
        ${DOT(185, 78)}
        <!-- R1 to Ground -->
        <path d="M185 78 v25"/>
        ${Rz(160, 115, 50, 18, "R1 = 1 kΩ")}
        <path d="M185 124 v20"/>
        ${GND(185, 144)}
        <!-- Feedback resistor Rf -->
        <path d="M185 78 v-42 h30"/>
        ${Rz(215, 36, 60, 18, "Rf = 10 kΩ")}
        <path d="M275 36 h60 v54"/>
        ${DOT(335, 90)}
        <!-- Output wire -->
        <path d="M285 90 h130"/>
        <circle cx="415" cy="90" r="3" fill="currentColor"/>
        <text x="425" y="94" font-size="12" font-weight="bold">Vo</text>
        <!-- Formula text -->
        <text x="240" y="168" text-anchor="middle" font-size="12" font-weight="600" fill="var(--primary)">Non-Inverting: Vo = (1 + Rf / R1) · Vi = 11 · Vi  (0° Phase Shift)</text>
    `, 480, 180);

    // 3. IC741 8-PIN DIP PINOUT
    const PIN_SVG = sv(`
        <!-- Chip body -->
        <rect x="180" y="20" width="130" height="150" rx="8" fill="var(--surface-card)" stroke-width="2"/>
        <!-- Notch -->
        <path d="M230 20 a15 15 0 0 0 30 0" fill="var(--bg)"/>
        <!-- Pin 1 Dot index -->
        <circle cx="200" cy="38" r="3.5" fill="currentColor"/>
        
        <!-- Left pins: 1 to 4 -->
        <path d="M140 48 h40 M140 80 h40 M140 112 h40 M140 144 h40" stroke-width="2"/>
        <text x="130" y="52" text-anchor="end" font-size="11" font-weight="bold">1. Offset Null</text>
        <text x="130" y="84" text-anchor="end" font-size="11" font-weight="bold">2. Inverting (−)</text>
        <text x="130" y="116" text-anchor="end" font-size="11" font-weight="bold">3. Non-Inv (+)</text>
        <text x="130" y="148" text-anchor="end" font-size="11" font-weight="bold">4. −Vcc (−15V)</text>

        <!-- Right pins: 8 to 5 -->
        <path d="M310 48 h40 M310 80 h40 M310 112 h40 M310 144 h40" stroke-width="2"/>
        <text x="360" y="52" text-anchor="start" font-size="11" font-weight="bold">8. NC (No Connect)</text>
        <text x="360" y="84" text-anchor="start" font-size="11" font-weight="bold">7. +Vcc (+15V)</text>
        <text x="360" y="116" text-anchor="start" font-size="11" font-weight="bold">6. Output (Vo)</text>
        <text x="360" y="148" text-anchor="start" font-size="11" font-weight="bold">5. Offset Null</text>

        <text x="245" y="105" text-anchor="middle" font-size="13" font-weight="800">µA741</text>
    `, 480, 185);

    // 4. SALLEN-KEY 2ND ORDER ACTIVE LOW-PASS FILTER
    const LPF_SVG = sv(`
        ${OA(270, 65)}
        <circle cx="20" cy="107" r="3" fill="currentColor"/>
        <text x="12" y="111" font-size="11" font-weight="bold">Vin</text>
        <path d="M20 107 h30"/>
        ${Rz(50, 107, 44, 16, "R2 3.3k")}
        <path d="M94 107 h30"/>
        ${DOT(124, 107)}
        ${Rz(124, 107, 44, 16, "R3 3.3k")}
        <path d="M168 107 h102"/>
        ${DOT(210, 107)}
        <!-- C3 to Ground -->
        <path d="M210 107 v20"/>
        <path d="M198 127 h24 M198 131 h24"/>
        <text x="230" y="132" font-size="10">C3 0.01µF</text>
        <path d="M210 131 v15"/>
        ${GND(210, 146)}
        <!-- C2 Feedback to Output -->
        <path d="M124 107 v-65 h190 v48"/>
        <path d="M210 42 h24 M210 46 h24"/>
        <text x="240" y="44" font-size="10">C2 0.01µF</text>
        ${DOT(314, 95)}
        <!-- Output -->
        <path d="M325 95 h110"/>
        <circle cx="435" cy="95" r="3" fill="currentColor"/>
        <text x="445" y="99" font-size="11" font-weight="bold">Vo</text>
        <!-- Gain feedback to Pin 2 (-) -->
        <path d="M270 83 h-30 v30"/>
        ${Rz(220, 125, 40, 16, "R1 10k")}
        <path d="M240 133 v15"/>
        ${GND(240, 148)}
        <path d="M240 98 h40 v-30 h34"/>
        <text x="240" y="172" text-anchor="middle" font-size="11" font-weight="600" fill="var(--primary)">fc = 1 / (2πRC) ≈ 4.82 kHz · Roll-off: −40 dB/decade · Af = 1.586 (Butterworth)</text>
    `, 480, 185);

    // 5. ASTABLE SQUARE-WAVE GENERATOR
    const SQ_SVG = sv(`
        ${OA(230, 60)}
        <!-- Inverting Pin 2: Timing RC -->
        <path d="M230 78 h-50"/>
        ${DOT(180, 78)}
        <path d="M180 78 v30"/>
        <path d="M168 108 h24 M168 112 h24"/>
        <text x="125" y="112" font-size="10">C1 0.1µF</text>
        <path d="M180 112 v18"/>
        ${GND(180, 130)}
        <!-- Timing resistor R3 from Output back to Pin 2 -->
        <path d="M180 78 v-45 h30"/>
        ${Rz(210, 33, 55, 18, "R3 = 10 kΩ")}
        <path d="M265 33 h65 v57"/>
        ${DOT(330, 90)}
        <!-- Output -->
        <path d="M285 90 h120"/>
        <circle cx="405" cy="90" r="3" fill="currentColor"/>
        <text x="415" y="94" font-size="11" font-weight="bold">Vo (±Vsat)</text>
        <!-- Non-inverting Pin 3: Voltage divider R1 and R2 -->
        <path d="M230 102 h-35"/>
        ${DOT(195, 102)}
        <!-- R1 to Ground -->
        <path d="M195 102 v18"/>
        ${Rz(170, 130, 50, 16, "R1 100k")}
        <path d="M195 138 v15"/>
        ${GND(195, 153)}
        <!-- R2 to Output -->
        <path d="M195 102 v-15 h80 v-20"/>
        <text x="240" y="172" text-anchor="middle" font-size="11" font-weight="600" fill="var(--primary)">β = R1/(R1+R2) = 0.5 · T = 2·R3·C1·ln(3) ≈ 2.2·R3·C1 ≈ 2.2 ms · f ≈ 455 Hz</text>
    `, 480, 185);

    // 6. 4-BIT R-2R LADDER DAC
    const LAD_SVG = sv(`
        <!-- Horizontal R line -->
        <path d="M50 50 h320"/>
        <!-- Inputs b0 to b3 -->
        ${[0, 1, 2, 3].map(i => {
            const x = 70 + i * 70;
            const bit = i === 3 ? 'b3 (MSB)' : (i === 0 ? 'b0 (LSB)' : `b${i}`);
            return `
                <path d="${x} 50 v25"/>
                ${Rz(x-20, 85, 40, 16, "2R")}
                <path d="${x} 93 v25"/>
                <circle cx="${x}" cy="118" r="3" fill="currentColor"/>
                <text x="${x}" y="132" text-anchor="middle" font-size="10" font-weight="bold">${bit}</text>
                ${i < 3 ? Rz(x+15, 50, 40, 14, "R") : ''}
            `;
        }).join('')}
        <!-- Terminating 2R to ground on left -->
        <path d="M50 50 v25"/>
        ${Rz(30, 85, 40, 16, "2R")}
        <path d="M50 93 v25"/>
        ${GND(50, 118)}
        <!-- Summing to Op-Amp Inverting terminal -->
        <path d="M280 50 h60 v30 h20"/>
        ${OA(360, 68)}
        <path d="M360 110 h-20 v15"/>
        ${GND(340, 125)}
        <!-- Feedback Rf = 3R -->
        <path d="M340 80 v-40 h30"/>
        ${Rz(370, 40, 44, 16, "Rf = 3R")}
        <path d="M414 40 h20 v58"/>
        <!-- Output -->
        <path d="M415 98 h40"/>
        <circle cx="455" cy="98" r="3" fill="currentColor"/>
        <text x="462" y="102" font-size="11" font-weight="bold">Vo</text>
        <text x="240" y="155" text-anchor="middle" font-size="11" font-weight="600" fill="var(--primary)">Vout = −(Rf / Req) · Vref · (b3/2 + b2/4 + b1/8 + b0/16)</text>
    `, 480, 170);

    // ==========================================
    // COMPLETE 11 EXPERIMENTS DATASET
    // ==========================================
    const E = [
        {
            n: 1,
            t: 'Inverting and Non-inverting Amplifier',
            aim: 'To design, construct and test inverting and non-inverting operational amplifiers using IC µA741, and verify theoretical voltage gain against experimental observations.',
            ic: 'IC µA741 (8-Pin DIP)',
            parts: [
                ['Op-Amp IC 741', '8-Pin DIP, High Gain BJT', '1'],
                ['Dual Power Supply', '±15 V regulated DC', '1'],
                ['Resistors', '1 kΩ, 10 kΩ (1/4 W, 5%)', '1, 1'],
                ['Function Generator', '0–3 MHz Sine / Square', '1'],
                ['CRO / DSO', 'Dual trace, 0–30 MHz', '1'],
                ['Breadboard & Connecting wires', 'Solderless breadboard', '1 set']
            ],
            circuits: [
                {
                    src: 'images/page_8_img_2.png',
                    title: 'Inverting Amplifier Circuit Diagram',
                    cap: 'Input Vi applied through R1 (1 kΩ) to inverting pin 2. Pin 3 grounded. Negative feedback via Rf (10 kΩ). Gain Av = −(Rf / R1) = −10.'
                },
                {
                    src: 'images/page_9_img_1.png',
                    title: 'Non-Inverting Amplifier Circuit Diagram',
                    cap: 'Input Vi applied directly to non-inverting pin 3 (+). Pin 2 connected to feedback divider R1 and Rf. Gain Av = 1 + (Rf / R1) = +11.'
                },
                {
                    src: 'images/page_8_img_1.jpg',
                    title: 'IC µA741 Pinout Configuration (8-Pin DIP)',
                    cap: 'Pin assignments: 1 & 5 Offset Null, 2 Inverting (−), 3 Non-inverting (+), 4 −Vcc (−15V), 6 Output, 7 +Vcc (+15V), 8 NC.'
                }
            ],
            graphs: [
                {
                    src: 'images/page_11_img_1.jpg',
                    title: 'Inverting Amplifier Input vs Output Waveforms',
                    cap: 'Shows input sine wave Vi (2V peak) and amplified output sine wave Vo (5V peak) with exact 180° phase inversion.'
                },
                {
                    src: 'images/page_11_img_2.jpg',
                    title: 'Non-Inverting Amplifier Input vs Output Waveforms',
                    cap: 'Shows input sine wave Vi (2V peak) and amplified output sine wave Vo (5.5V peak) in-phase (0° phase shift).'
                }
            ],
            svg: INV_SVG + '<br>' + NON_SVG,
            cap: 'Interactive vector schematics for IC741 Inverting and Non-Inverting configurations.',
            theory: 'The operational amplifier is a high-gain direct-coupled differential amplifier. In the inverting configuration, input is applied to pin 2 while pin 3 is grounded. Since the open-loop gain Aol is very large (≈2×10⁵), negative feedback forces the inverting terminal to the same potential as the non-inverting terminal (virtual ground, V− ≈ 0 V). Applying Kirchhoff’s Current Law at node A yields (Vi/R1) + (Vo/Rf) = 0, giving Vo = −(Rf/R1)·Vi. In the non-inverting configuration, input is fed directly to pin 3 (+), yielding Vo = (1 + Rf/R1)·Vi.',
            f: [
                'Inverting Gain: Av = Vo / Vi = −(Rf / R1)  [Rf = 10 kΩ, R1 = 1 kΩ → Av = −10]',
                'Non-Inverting Gain: Av = Vo / Vi = 1 + (Rf / R1)  [Av = 1 + 10 = +11]',
                'Practical Gain = Vo(peak-to-peak) / Vi(peak-to-peak)'
            ],
            proc: [
                'Verify IC741 pin configuration and insert onto breadboard.',
                'Connect ±15 V dual power supply to pin 7 (+Vcc) and pin 4 (−Vcc). Ground the common supply terminal.',
                'For inverting amplifier: Connect R1 = 1 kΩ to pin 2, Rf = 10 kΩ between pin 2 and pin 6, and ground pin 3.',
                'Apply a 1 kHz sine wave (1 V p-p) from function generator to input terminal Vi.',
                'Observe Vi and Vo simultaneously on CRO Channels 1 and 2 in dual mode; verify 180° phase inversion.',
                'Measure output amplitude Vo for various input voltages and record in the observation table.',
                'Repeat the procedure for the non-inverting configuration by applying Vi to pin 3 and connecting R1 from pin 2 to ground.'
            ],
            tab: ['Configuration', 'Input Vi (V p-p)', 'Output Vo (V p-p)', 'Theoretical Gain', 'Practical Gain', 'Phase Shift'],
            rows: [
                ['Inverting', '0.5 V', '5.0 V', '−10', '10.0', '180°'],
                ['Inverting', '1.0 V', '10.0 V', '−10', '10.0', '180°'],
                ['Non-Inverting', '0.5 V', '5.5 V', '+11', '11.0', '0°'],
                ['Non-Inverting', '1.0 V', '11.0 V', '+11', '11.0', '0°']
            ],
            calc: 'Given: R1 = 1 kΩ, Rf = 10 kΩ, Vi = 1.0 V p-p\n• Inverting: Vo = −(10 kΩ / 1 kΩ) × 1.0 V = −10.0 V p-p\n• Non-Inverting: Vo = (1 + 10 kΩ / 1 kΩ) × 1.0 V = +11.0 V p-p\n• Practical Gain: Av = 10.0 V / 1.0 V = 10 (Inverting), 11.0 V / 1.0 V = 11 (Non-Inverting)',
            res: 'Inverting and non-inverting amplifiers were successfully constructed using IC741. Practical voltage gains matched theoretical values within 1% tolerance, and expected phase shifts (180° inversion vs 0° in-phase) were verified on CRO.',

        query = query.toLowerCase().trim();
        if (!query) {
            setView('exp');

            return blob.includes(query);
        });

        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

        if (matches.length === 0) {
            appContainer.innerHTML = `
                <div class="manual-banner">
                    <h2>No Matching Experiments</h2>
                    <p>No results found for “${query}”. Try searching for an IC number (741, 565, 723), component, or concept.</p>

        const buttons = dock.querySelectorAll('.dock-box-btn');
        const cards = document.querySelectorAll('article.exp-card');
        if (!cards.length || !buttons.length) return;

        const scrollPos = window.scrollY + 180;
        let currentNum = '1';

        for (let i = 0; i < cards.length; i++) {
            const card = cards[i];
            if (card.offsetTop <= scrollPos) {
                currentNum = card.id.replace('e', '');
            } else {
                break;
            }
        }

        buttons.forEach(btn => {
            if (btn.getAttribute('data-exp') === currentNum) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });

        const pill = document.getElementById('mobileCurrExp');
        if (pill) pill.textContent = currentNum;

        const select = document.getElementById('jump-select');
        if (select) select.value = 'e' + currentNum;
    }

        window.addEventListener('scroll', updateActiveLicExp, { passive: true });
        window.addEventListener('resize', updateActiveLicExp, { passive: true });
        updateActiveLicExp();
    }

    setTimeout(initScrollSpy, 300);
    </script>
