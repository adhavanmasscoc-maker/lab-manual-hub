<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EC5301 Analog Communication Laboratory | Exam Prep Companion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #dde3eb;
            --surface: #edf2f7;
            --surface-card: #f8fafc;
            --border: #cbd5e1;
            --border-strong: #94a3b8;
            --text-main: #0f172a;
            --text-muted: #475569;
            --text-sub: #64748b;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --primary-light: rgba(37, 99, 235, 0.08);
            --accent-green: #059669;
            --accent-amber: #d97706;
            --shadow-sm: 0 2px 6px rgba(15, 23, 42, 0.04);
            --shadow-md: 0 4px 14px rgba(15, 23, 42, 0.08);
            --shadow-lg: 0 10px 25px -4px rgba(15, 23, 42, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100vh;
        }

        /* STICKY TOP BAR */
        .top-header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(237, 242, 247, 0.96);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 10px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            box-shadow: var(--shadow-sm);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-badge {
            background: #0f172a;
            color: #ffffff;
            font-family: 'Fira Code', monospace;
            font-size: 11px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 4px;
            letter-spacing: 0.04em;
        }

        .header-title {
            font-weight: 800;
            font-size: 14.5px;
            color: var(--text-main);
            letter-spacing: -0.01em;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #ffffff;
            text-decoration: none;
            font-size: 12px;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 3px 8px rgba(15, 23, 42, 0.2);
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            white-space: nowrap;
        }

        .btn-back:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 14px rgba(37, 99, 235, 0.35), 0 0 0 1.5px #3b82f6;
            color: #fff;
        }

        .jump-select {
            padding: 6px 10px;
            font-size: 12.5px;
            font-weight: 600;
            font-family: inherit;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: #ffffff;
            color: var(--text-main);
            outline: none;
            cursor: pointer;
            transition: border-color 0.2s, box-shadow 0.2s;
            max-width: 220px;
        }

        .jump-select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        /* NAVIGATION TABS & SEARCH */
        .nav-bar {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 10px 18px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
        }

        .tab-btn {
            font-family: inherit;
            font-size: 12.5px;
            font-weight: 600;
            padding: 6px 14px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: #ffffff;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
            white-space: nowrap;
        }

        .tab-btn:hover {
            background: #f1f5f9;
            color: var(--text-main);
            transform: translateY(-1px);
        }

        .tab-btn.active {
            background: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
            box-shadow: 0 2px 6px rgba(37, 99, 235, 0.25);
        }

        .search-input {
            flex: 1;
            min-width: 200px;
            padding: 6px 12px;
            font-size: 13px;
            font-family: inherit;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: #ffffff;
            color: var(--text-main);
            outline: none;
            transition: all 0.2s;
        }

        .search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        /* MAIN CONTAINER */
        main {
            max-width: 960px;
            margin: 20px auto 60px;
            padding: 0 16px;
        }

        /* BANNER */
        .manual-banner {
            background: var(--surface);
            border: 1px solid var(--border);
            border-left: 6px solid var(--primary);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-sm);
        }

        .manual-banner h1 {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 22px;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.02em;
            margin-bottom: 4px;
        }

        .manual-banner p {
            font-size: 13.5px;
            color: var(--text-muted);
        }

        /* EXPERIMENT CARD */
        article.exp-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-left: 5px solid var(--primary);
            border-radius: 10px;
            padding: 16px 20px 20px;
            margin-bottom: 22px;
            box-shadow: var(--shadow-sm);
            transition: box-shadow 0.2s ease, transform 0.2s ease;
        }

        article.exp-card:hover {
            box-shadow: var(--shadow-md);
        }

        .exp-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }

        .exp-badge {
            font-family: 'Fira Code', monospace;
            font-size: 11.5px;
            font-weight: 700;
            color: var(--primary);
            background: rgba(37, 99, 235, 0.1);
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid rgba(37, 99, 235, 0.2);
        }

        .exp-title {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 18px;
            font-weight: 800;
            color: var(--text-main);
            flex: 1;
            min-width: 250px;
        }

        .exp-type-tag {
            font-family: 'Fira Code', monospace;
            font-size: 12px;
            font-weight: 700;
            background: #0f172a;
            color: #ffffff;
            padding: 3px 8px;
            border-radius: 4px;
        }

        /* DIRECT EXPANDED SECTIONS (ZERO CLICK TO VIEW) */
        .sec-block {
            border-top: 1px solid var(--border);
            padding: 14px 0 10px;
        }

        .sec-block:first-of-type {
            border-top: none;
            padding-top: 4px;
        }

        .sec-heading {
            font-size: 14px;
            font-weight: 700;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .section-body {
            padding: 4px 0 6px;
            font-size: 13.5px;
            color: var(--text-main);
        }

        /* ================= UNIVERSAL ASIDE QUICK-JUMP EXPERIMENT DOCK ================= */
        .exp-quick-dock {
            position: fixed;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 999;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(15, 23, 42, 0.94);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 12px;
            padding: 8px 6px;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.3);
            max-height: 85vh;
            transition: all 0.25s ease;
        }

        .exp-quick-dock .dock-header {
            display: flex;
            align-items: center;
            gap: 4px;
            padding-bottom: 6px;
            margin-bottom: 4px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            font-size: 10px;
            font-weight: 800;
            color: #94a3b8;
            letter-spacing: 0.05em;
        }

        .exp-quick-dock .dock-badge {
            background: #2563eb;
            color: #fff;
            font-size: 9px;
            padding: 1px 5px;
            border-radius: 4px;
        }

        .exp-quick-dock .dock-grid {
            display: grid;
            grid-template-columns: repeat(2, 28px);
            gap: 4px;
            overflow-y: auto;
            max-height: calc(85vh - 75px);
            padding: 2px;
            scrollbar-width: none;
        }
        .exp-quick-dock .dock-grid::-webkit-scrollbar {
            display: none;
        }

        .dock-box-btn {
            width: 28px;
            height: 28px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-family: 'Fira Code', monospace;
            font-size: 11.5px;
            font-weight: 700;
            color: #cbd5e1;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .dock-box-btn:hover {
            background: #2563eb;
            color: #ffffff;
            border-color: #60a5fa;
            transform: scale(1.08);
        }

        .dock-box-btn.active {
            background: #2563eb;
            color: #ffffff;
            border-color: #93c5fd;
            box-shadow: 0 0 10px rgba(37, 99, 235, 0.7);
            font-weight: 800;
        }

        .exp-quick-dock .dock-footer {
            margin-top: 4px;
            padding-top: 4px;
            border-top: 1px solid rgba(255, 255, 255, 0.12);
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .dock-top-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 4px;
            transition: color 0.15s;
        }

        .dock-top-btn:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.1);
        }

        /* Mobile Quick Bar / Drawer */
        .mobile-exp-pill {
            display: none;
            position: fixed;
            bottom: 16px;
            right: 16px;
            z-index: 1000;
            background: #0f172a;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 999px;
            padding: 8px 14px;
            font-size: 12px;
            font-weight: 700;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
            cursor: pointer;
            align-items: center;
            gap: 6px;
        }

        @media (max-width: 900px) {
            .exp-quick-dock {
                right: 8px;
            }
        }

        @media (max-width: 768px) {
            .exp-quick-dock {
                display: none;
            }
            .exp-quick-dock.mobile-open {
                display: flex;
                right: 16px;
                bottom: 60px;
                top: auto;
                transform: none;
                z-index: 1001;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            }
            .mobile-exp-pill {
                display: flex;
            }
        }

        /* TABLES */
        .table-wrap {
            overflow-x: auto;
            margin: 8px 0;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: #ffffff;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            font-size: 12.5px;
            text-align: left;
        }

        th, td {
            border: 1px solid var(--border);
            padding: 8px 12px;
            min-width: 70px;
        }

        th {
            background: #f1f5f9;
            color: var(--text-main);
            font-weight: 700;
        }

        td[contenteditable="true"] {
            background: #fff;
            outline: none;
            transition: background 0.15s;
        }

        td[contenteditable="true"]:focus {
            background: #eff6ff;
            box-shadow: inset 0 0 0 2px var(--primary);
        }

        /* FORMULAS & CODE */
        .formula-box {
            font-family: 'Fira Code', monospace;
            font-size: 12.5px;
            background: #0f172a;
            color: #38bdf8;
            padding: 10px 14px;
            border-radius: 6px;
            margin: 6px 0;
            overflow-x: auto;
            border: 1px solid #1e293b;
        }

        .code-container {
            position: relative;
            margin: 8px 0;
        }

        .code-box {
            font-family: 'Fira Code', monospace;
            font-size: 12px;
            background: #0f172a;
            color: #e2e8f0;
            padding: 14px 16px;
            border-radius: 8px;
            overflow-x: auto;
            border: 1px solid #1e293b;
            line-height: 1.5;
            white-space: pre;
        }

        .btn-copy-code {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #1e293b;
            color: #cbd5e1;
            border: 1px solid #334155;
            padding: 4px 10px;
            font-size: 11px;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-copy-code:hover {
            background: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
        }

        /* DIAGRAMS & MEDIA */
        .diagram-container {
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            margin: 10px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: inset 0 1px 3px rgba(15, 23, 42, 0.02);
        }

        .diagram-img {
            max-width: 100%;
            height: auto;
            border-radius: 6px;
            border: 1px solid var(--border);
            cursor: zoom-in;
            transition: transform 0.2s;
        }

        .diagram-img:hover {
            transform: scale(1.01);
        }

        svg {
            width: 100%;
            max-width: 620px;
            height: auto;
            display: block;
            color: var(--text-main);
            cursor: zoom-in;
            transition: transform 0.15s;
        }

        svg:hover {
            transform: scale(1.01);
        }

        svg * {
            stroke: currentColor;
            fill: none;
            stroke-width: 1.6;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        svg text {
            fill: currentColor;
            stroke: none;
            font-family: 'Inter', -apple-system, sans-serif;
            font-size: 11px;
            font-weight: 500;
        }

        .diagram-caption {
            font-size: 11.5px;
            color: var(--text-sub);
            margin-top: 8px;
            text-align: center;
        }

        /* PROCEDURE LIST */
        ol.proc-list, ul.proc-list {
            padding-left: 20px;
            margin: 6px 0;
        }

        ol.proc-list li, ul.proc-list li {
            margin-bottom: 6px;
            line-height: 1.5;
        }

        /* VIVA QA (DIRECT VIEW - NO CLICK NEEDED) */
        .viva-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 8px 0;
        }

        .viva-item {
            background: #ffffff;
            border: 1px solid var(--border);
            border-left: 4px solid var(--primary);
            border-radius: 6px;
            padding: 10px 14px;
        }

        .viva-q {
            font-weight: 700;
            color: var(--text-main);
            font-size: 13px;
            margin-bottom: 4px;
        }

        .viva-a {
            color: #0f766e;
            font-size: 13px;
            line-height: 1.45;
        }

        .viva-key {
            display: inline-block;
            font-size: 11px;
            font-weight: 700;
            color: var(--accent-amber);
            background: #fffbeb;
            border: 1px solid #fde68a;
            padding: 2px 7px;
            border-radius: 4px;
            margin-top: 4px;
        }

        /* CHECKLIST IN EXAM MODE */
        .checklist-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 0;
            font-size: 13px;
            border-bottom: 1px dashed var(--border);
        }

        .checklist-item input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        /* LIGHTBOX */
        #lightbox {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(6px);
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 2000;
            cursor: zoom-out;
        }

        #lightbox-content {
            background: #ffffff;
            border-radius: 12px;
            padding: 24px;
            max-width: 90vw;
            max-height: 90vh;
            overflow: auto;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #lightbox-content img, #lightbox-content svg {
            max-width: 820px;
            width: 100%;
            height: auto;
        }

        /* FOOTER */
        footer {
            text-align: center;
            font-size: 13px;
            color: var(--text-sub);
            padding: 20px 0;
            border-top: 1px solid var(--border);
            margin-top: 40px;
        }

        footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
        }

        @media (max-width: 640px) {
            .top-header {
                padding: 8px 12px;
            }
            .header-title span.full-title {
                display: none;
            }
            .nav-bar {
                padding: 8px 12px;
            }
            main {
                padding: 0 10px;
            }
            article.exp-card {
                padding: 14px;
            }
            .exp-title {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <!-- STICKY TOP BAR -->
    <header class="top-header">
        <div class="header-left">
            <span class="brand-badge">EC5301</span>
            <div class="header-title">
                <span>Analog Communication Lab</span>
                <span class="full-title" style="color:var(--text-muted); font-weight:600;">· Theory cum Practical</span>
            </div>
        </div>
        <div class="header-right">
            <select id="jump-select" class="jump-select" onchange="jumpTo(this.value)">
                <option value="">Jump to Experiment...</option>
                <optgroup label="Hardware Experiments (1–8)">
                    <option value="e1">Exp 1: AM Modulation & Demodulation</option>
                    <option value="e2">Exp 2: FM Modulation & Demodulation</option>
                    <option value="e3">Exp 3: Sampling & Reconstruction</option>
                    <option value="e4">Exp 4: PWM Motor Speed Control (Robotics)</option>
                    <option value="e5">Exp 5: Intelligent PPM Motor Control</option>
                    <option value="e6">Exp 6: PAM Biomedical Transmission</option>
                    <option value="e7">Exp 7: Pre-Emphasis & De-Emphasis</option>
                    <option value="e8">Exp 8: Time Division Multiplexing (TDM)</option>
                </optgroup>
                <optgroup label="MATLAB Simulation Experiments (9–14)">
                    <option value="e9">Exp 9: MATLAB AM Audio System</option>
                    <option value="e10">Exp 10: MATLAB FM Voice Rescue Link</option>
                    <option value="e11">Exp 11: MATLAB TDM Smart Healthcare</option>
                    <option value="e12">Exp 12: MATLAB Speech Pre/De-Emphasis</option>
                    <option value="e13">Exp 13: MATLAB Signal Denoising</option>
                    <option value="e14">Exp 14: MATLAB DSB-SC & SSB-SC Systems</option>
                </optgroup>
            </select>
            <a href="../../index.html" class="btn-back">
                <span class="hub-arrow">←</span> Back to Hub
            </a>
        </div>
    </header>

    <!-- NAVIGATION TABS & SEARCH -->
    <nav class="nav-bar">
        <button class="tab-btn active" data-v="exp">All Experiments (14)</button>
        <button class="tab-btn" data-v="hw">Hardware (8)</button>
        <button class="tab-btn" data-v="sim">MATLAB Simulation (6)</button>
        <button class="tab-btn" data-v="exam">Exam Day Checklist</button>
        <button class="tab-btn" data-v="viva">Viva Voce Bank</button>
        <button class="tab-btn" data-v="formula">Formula Bank</button>
        <button class="tab-btn" data-v="rev">Quick Revision</button>
        <input type="search" id="search" class="search-input" placeholder="Search (AM, FM, PWM, PPM, PAM, TDM, Nyquist, awgn, Hilbert)..." aria-label="Search">
    </nav>

    <!-- MAIN VIEW CONTAINER -->
    <main id="app-container">
        <!-- Content injected dynamically -->
    </main>

    <!-- UNIVERSAL ASIDE QUICK-JUMP EXPERIMENT DOCK (14 EXPERIMENTS) -->
    <aside class="exp-quick-dock dense" id="expQuickDock" aria-label="Quick Jump to Experiment">
        <div class="dock-header">
            <span class="dock-title">EXPS</span>
            <span class="dock-badge">14</span>
        </div>
        <div class="dock-grid">
            <button class="dock-box-btn" onclick="jumpTo('e1')" data-exp="1" title="Exp 1: AM Modulation & Demodulation">1</button>
            <button class="dock-box-btn" onclick="jumpTo('e2')" data-exp="2" title="Exp 2: FM Modulation & Demodulation">2</button>
            <button class="dock-box-btn" onclick="jumpTo('e3')" data-exp="3" title="Exp 3: Sampling & Reconstruction">3</button>
            <button class="dock-box-btn" onclick="jumpTo('e4')" data-exp="4" title="Exp 4: PWM Motor Speed Control">4</button>

// EC5301 - EXPERIMENT 4: PWM MOTOR SPEED CONTROLLER

const int potPin = A0;      // Analog input from speed potentiometer
const int pwmPin = 9;       // Timer1 PWM output connected to Driver Enable
const int in1Pin = 2;       // Direction Control Pin 1
const int in2Pin = 3;       // Direction Control Pin 2

void setup() {
  pinMode(pwmPin, OUTPUT);
  pinMode(in1Pin, OUTPUT);
  pinMode(in2Pin, OUTPUT);
  
  // Set Forward Direction
  digitalWrite(in1Pin, HIGH);
  digitalWrite(in2Pin, LOW);
  
  Serial.begin(9600);

  Serial.print(" | Duty: "); Serial.print(dutyCycle, 1); Serial.println("%");
  
  delay(20);

// Target: Arduino UNO (ATmega328P) | Actuator: Servo / Motor
// ========================================================
const int sensorPin = A0;   // Sensor / Pot input
const int ppmPin = 9;       // PPM pulse output

void setup() {
  pinMode(ppmPin, OUTPUT);
  Serial.begin(9600);
}

void loop() {
  int sensorVal = analogRead(sensorPin);
  // Map ADC (0-1023) to pulse position (1000 µs to 2000 µs)
  int pulseWidth = map(sensorVal, 0, 1023, 1000, 2000); 
  
  // Generate PPM Pulse
  digitalWrite(ppmPin, HIGH);
  delayMicroseconds(pulseWidth);
  digitalWrite(ppmPin, LOW);
  
  // Remainder of standard 20ms frame
  delayMicroseconds(20000 - pulseWidth);
  
  Serial.print("Sensor: "); Serial.print(sensorVal);
  Serial.print(" | PPM Pulse: "); Serial.print(pulseWidth); Serial.println(" us");
}`,

% EC5301 - EXPERIMENT 9: INTELLIGENT AM AUDIO TRANSMISSION
% Environment: MATLAB | Features: AWGN, Envelope Det, SNR

% 1. Load and Preprocess Audio
load handel;               % Built-in audio: y (audio data), Fs = 8192 Hz
x = y(1:min(5*Fs, length(y))); % Extract first 5 seconds
x = x(:) / max(abs(x));    % Normalize to unity peak
t = (0:length(x)-1)' / Fs;

% 2. AM Modulation Parameters
fc = 10000;                % Carrier frequency = 10 kHz
mu = 0.8;                  % Modulation index = 0.8
carrier = cos(2*pi*fc*t);
am_signal = (1 + mu * x) .* carrier;

% 3. Noisy Channel (AWGN)
channel_snr = 20;          % Channel SNR = 20 dB
noisy_signal = awgn(am_signal, channel_snr, 'measured');

% 4. Envelope Demodulation
rectified = abs(noisy_signal);
[b, a] = butter(6, 4000 / (Fs/2));     % 6th-order Butterworth LPF
recovered = filtfilt(b, a, rectified); % Zero-phase filtering
recovered = recovered - mean(recovered);
recovered = recovered / max(abs(recovered)); % Normalize

% 5. Link Performance Evaluation
err = x - recovered;
snr_out = 10 * log10(sum(x.^2) / sum(err.^2));

                <div class="section-body">
                    <div class="diagram-container">
                        ${e.svg}
                        <div class="diagram-caption">${e.cap}</div>
                    </div>
                    ${e.img ? `
                        <div class="diagram-container" style="margin-top:12px;">
                            <img src="${e.img}" alt="Lab manual diagram for ${e.t}" class="diagram-img" onclick="openLightbox(this.outerHTML)">
                            <div class="diagram-caption">Authentic Lab Manual Schematic (Tap to enlarge in Lightbox)</div>
                        </div>
                    ` : ''}
                    ${e.modelGraph ? `
                        <div class="diagram-container" style="margin-top:12px;">
                            <img src="${e.modelGraph}" alt="Model graph for ${e.t}" class="diagram-img" onclick="openLightbox(this.outerHTML)">
                            <div class="diagram-caption">Model Waveform & Graph (Tap to enlarge in Lightbox)</div>
                        </div>
                    ` : ''}
                </div>
            </div>

            <!-- THEORY -->
            <div class="sec-block">
                <div class="sec-heading">📖 Theory & Operating Principle</div>
                <div class="section-body">
                    <p>${e.theory}</p>
                </div>
            </div>

            <!-- FORMULAE -->
            <div class="sec-block">
                <div class="sec-heading">📐 Formulae & Governing Equations</div>
                <div class="section-body">
                    ${e.f.map(x => `<div class="formula-box">${x}</div>`).join('')}
                </div>
            </div>

            <!-- SOURCE CODE (IF ARDUINO OR MATLAB) -->
            ${e.code ? `
                <div class="sec-block">
                    <div class="sec-heading">💻 Source Program (${e.cat.includes('MATLAB') ? 'MATLAB Code' : 'Arduino C++ Code'})</div>
                    <div class="section-body">
                        <div class="code-container">
                            <button class="btn-copy-code" onclick="copyCode(this)">Copy Code</button>
                            <pre class="code-box">${e.code}</pre>
                        </div>
                    </div>
                </div>
            ` : ''}

            <!-- PROCEDURE -->
            <div class="sec-block">
                <div class="sec-heading">📋 Step-by-Step Procedure</div>
                <div class="section-body">
                    <ol class="proc-list">
                        ${e.proc.map(p => `<li>${p}</li>`).join('')}
                    </ol>
                </div>
            </div>

            <!-- OBSERVATION TABLE -->
            <div class="sec-block">
                <div class="sec-heading">📊 Tabular Column & Model Readings</div>
                <div class="section-body">
                    <p style="font-size:12px; color:var(--text-sub); margin-bottom:6px;">💡 Cells are editable. You can type your own lab observations directly into the table.</p>
                    ${renderTable(e.tab, e.rows)}
                </div>
            </div>

            <!-- MODEL CALCULATION -->
            <div class="sec-block">
                <div class="sec-heading">🧮 Model Calculations</div>
                <div class="section-body">
                    <div class="code-box" style="white-space:pre-wrap;">${e.calc}</div>
                </div>
            </div>

            <!-- RESULT & PRECAUTIONS -->
            <div class="sec-block">
                <div class="sec-heading">✅ Result & Precautions</div>
                <div class="section-body">
                    <div style="background:#f0fdf4; border:1px solid #bbf7d0; border-left:4px solid #16a34a; padding:10px 14px; border-radius:6px; margin-bottom:10px;">
                        <b>Result:</b> ${e.res}
                    </div>
                    <b>Precautions:</b>
                    <ul class="proc-list" style="margin-top:4px;">
                        ${e.pre.map(pr => `<li>${pr}</li>`).join('')}
                    </ul>
                </div>
            </div>

            <!-- VIVA VOCE -->
            <div class="sec-block">
                <div class="sec-heading">💬 Viva Voce Questions & Answers</div>
                <div class="section-body">
                    <div class="viva-list">
                        ${e.viva.map(v => `
                            <div class="viva-item">
                                <div class="viva-q">Q: ${v[0]}</div>
                                <div class="viva-a"><b>Ans:</b> ${v[1]}</div>
                                <div class="viva-key">🔑 Key: ${v[2]}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            </div>
        </article>
    `;

    // EXAM CHECKLIST
    const EXAM_CHECKLIST = [
        "1. Write the Aim and Course Title clearly on the top of the examination paper.",
        "2. List all Apparatus / Trainer Kits / Software toolboxes required.",
        "3. Draw the complete Block Diagram with signal flow arrows and labeled test points.",
        "4. For Hardware: Check AC power supply, establish common ground between kit and CRO.",
        "5. For Arduino: Verify pin numbers (Pin 9 PWM, Pin A0 ADC, driver pins 2/3).",
        "6. For MATLAB: Ensure all variables are normalized and sampling rates satisfy Nyquist.",
        "7. Connect input signals: observe clean unmodulated carrier and modulating baseband.",
        "8. Perform modulation: observe modulated envelope or pulses on oscilloscope / MATLAB figure.",
        "9. Tabulate readings: measure Vmax, Vmin, time periods, and calculate modulation index / SNR.",
        "10. Verify that experimental measurements match theoretical design values within tolerance.",
        "11. Draw clean model graphs with voltage and time scales clearly designated.",
        "12. Write final Result with measured values and review Viva Voce key points."
    ];

    const V = {
        exp: () => `
            <div class="manual-banner">
                <h1>EC5301 – Analog Communication Laboratory</h1>
                <p>Complete 14 Experiments (8 Hardware + 6 MATLAB Simulation) with Diagrams, Arduino & MATLAB Codes, Tables, Calculations & Viva</p>
            </div>
            ${E.map(renderExp).join('')}
        `,

        hw: () => `
            <div class="manual-banner">
                <h1>Hardware Experiments (Exps 1 to 8)</h1>
                <p>Trainer kits, Arduino microcontroller circuits, and discrete transistor breadboard experiments.</p>
            </div>
            ${E.filter(e => e.cat === 'Hardware').map(renderExp).join('')}
        `,

        sim: () => `
            <div class="manual-banner">
                <h1>MATLAB Simulation Experiments (Exps 9 to 14)</h1>
                <p>Signal processing, noisy AWGN channel transmission, audio demodulation, and telemetry algorithms.</p>
            </div>
            ${E.filter(e => e.cat.includes('MATLAB')).map(renderExp).join('')}
        `,

        exam: () => `
            <div class="manual-banner">
                <h1>Practical Exam Day Checklist</h1>
                <p>Universal 12-step master workflow to score 100/100 in EC5301 Practical Examination.</p>
            </div>
            <article class="exp-card">
                <h2 style="font-size:16px; margin-bottom:12px;">Universal 12-Step Lab Exam Execution Guide</h2>
                <div style="display:flex; flex-direction:column; gap:6px;">
                    ${EXAM_CHECKLIST.map((step, idx) => `
                        <label class="checklist-item">
                            <input type="checkbox" id="chk_${idx}">
                            <span><b>Step ${idx+1}:</b> ${step.substring(3)}</span>
                        </label>
                    `).join('')}
                </div>
            </article>
            ${E.map(e => `
                <article class="exp-card">
                    <div class="exp-header">
                        <span class="exp-badge">EXP ${e.n}</span>
                        <h3 style="font-size:15px; font-weight:700;">${e.t}</h3>
                        <span class="exp-type-tag">${e.cat}</span>
                    </div>
                    <div style="font-size:13px; color:var(--text-muted); margin-bottom:8px;">
                        <b>Formula:</b> <code>${e.f[0]}</code>
                    </div>
                    <div style="display:flex; gap:10px; flex-wrap:wrap;">
                        <label class="checklist-item"><input type="checkbox"> Block Diagram Drawn</label>
                        <label class="checklist-item"><input type="checkbox"> Connections / Code Verified</label>
                        <label class="checklist-item"><input type="checkbox"> Waveform Plotted on CRO/MATLAB</label>
                        <label class="checklist-item"><input type="checkbox"> Observation Table Filled</label>
                        <label class="checklist-item"><input type="checkbox"> Result & Viva Prepared</label>
                    </div>
                </article>
            `).join('')}
        `,

        viva: () => `
            <div class="manual-banner">
                <h1>Comprehensive Viva Voce Bank</h1>
                <p>Direct question & answer bank covering all 14 experiments for university lab viva examinations.</p>
            </div>
            ${E.map(e => `
                <article class="exp-card">
                    <div class="exp-header">
                        <span class="exp-badge">EXP ${e.n}</span>
                        <h3 style="font-size:16px; font-weight:800;">${e.t}</h3>
                    </div>
                    <div class="viva-list">
                        ${e.viva.map(v => `
                            <div class="viva-item">
                                <div class="viva-q">Q: ${v[0]}</div>
                                <div class="viva-a"><b>Ans:</b> ${v[1]}</div>
                                <div class="viva-key">🔑 Key: ${v[2]}</div>
                            </div>
                        `).join('')}
                    </div>
                </article>
            `).join('')}
        `,

        formula: () => `
            <div class="manual-banner">
                <h1>Formula Bank & Governing Equations</h1>
                <p>Master collection of all modulation indices, power ratios, Carson bandwidths, and SNR equations.</p>
            </div>
            ${E.map(e => `
                <article class="exp-card">
                    <div class="exp-header">
                        <span class="exp-badge">EXP ${e.n}</span>
                        <h3 style="font-size:15px; font-weight:700;">${e.t}</h3>
                    </div>
                    ${e.f.map(f => `<div class="formula-box">${f}</div>`).join('')}
                </article>
            `).join('')}
        `,

        rev: () => `
            <div class="manual-banner">
                <h1>Last-Minute Quick Revision Cards</h1>
                <p>Speed-run summary of all 14 experiments for quick recap before entering the exam hall.</p>
            </div>
            ${E.map(e => `
                <article class="exp-card">
                    <div class="exp-header">
                        <span class="exp-badge">EXP ${e.n}</span>
                        <h3 style="font-size:16px; font-weight:800;">${e.t}</h3>
                        <span class="exp-type-tag">${e.cat}</span>
                    </div>
                    <div style="font-size:13.5px; margin-bottom:8px;">
                        <b>Core Aim:</b> ${e.aim}
                    </div>
                    <div class="formula-box">${e.f[0]}</div>
                    <div style="background:#eff6ff; border:1px solid #bfdbfe; padding:8px 12px; border-radius:6px; font-size:13px; margin:8px 0;">
                        <b>Exam Key Takeaway:</b> ${e.res}
                    </div>
                    <div class="viva-item" style="margin-top:6px;">
                        <div class="viva-q">Q: ${e.viva[0][0]}</div>
                        <div class="viva-a"><b>Ans:</b> ${e.viva[0][1]}</div>
                    </div>
                </article>
            `).join('')}
        `
    };

    // ==========================================
    // CONTROLLER & EVENT LISTENERS
    // ==========================================
    const appContainer = document.getElementById('app-container');
    const searchInput = document.getElementById('search');

    function setView(viewName) {
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.v === viewName);
        });
        if (V[viewName]) {
            appContainer.innerHTML = V[viewName]();
        }
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function jumpTo(id) {
        if (!id) return;
        setView('exp');
        setTimeout(() => {
            const el = document.getElementById(id);
            if (el) {
                el.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }, 100);
    }

    function searchExperiments(query) {
        query = query.toLowerCase().trim();
        if (!query) {
            setView('exp');
            return;
        }

        const matches = E.filter(e => {
            const blob = (e.t + ' ' + e.aim + ' ' + e.dev + ' ' + e.theory + ' ' + e.f.join(' ') + ' ' + (e.code || '') + ' ' + e.viva.map(v => v[0] + ' ' + v[1]).join(' ')).toLowerCase();
            return blob.includes(query);
        });

        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

        if (matches.length === 0) {
            appContainer.innerHTML = `
                <div class="manual-banner">
                    <h2>No Matching Experiments</h2>
                    <p>No results found for “${query}”. Try searching for an experiment name, formula term, or function name.</p>
                </div>
            `;
        } else {
            appContainer.innerHTML = `
                <div class="manual-banner">
                    <h2>Search Results</h2>
                    <p>${matches.length} experiment(s) match “${query}”.</p>
                </div>
                ${matches.map(renderExp).join('')}
            `;
        }
    }

    // LIGHTBOX CONTROLS
    function openLightbox(htmlContent) {
        const lb = document.getElementById('lightbox');
        const content = document.getElementById('lightbox-content');
        content.innerHTML = htmlContent + `<div style="text-align:center; margin-top:14px;"><button style="padding:6px 14px; font-weight:bold; cursor:pointer;" onclick="closeLightbox()">Close Zoom</button></div>`;
        lb.style.display = 'flex';
    }

    function closeLightbox() {
        document.getElementById('lightbox').style.display = 'none';
    }

    // EVENT DELEGATION
    document.querySelector('.nav-bar').addEventListener('click', e => {
        if (e.target.dataset.v) {
            searchInput.value = '';
            setView(e.target.dataset.v);
        }
    });

    searchInput.addEventListener('input', e => {
        searchExperiments(e.target.value);
    });

    appContainer.addEventListener('click', e => {
        const svgEl = e.target.closest('svg');
        if (svgEl && !e.target.closest('#lightbox')) {
            openLightbox(svgEl.outerHTML);
        }
    });

    // Initialize default view
    setView('exp');

    // ==========================================
    // UNIVERSAL ASIDE DOCK SCROLLSPY & MOBILE CONTROLS
    // ==========================================
    function toggleMobileExpDock() {
        const dock = document.getElementById('expQuickDock');
        if (dock) {
            dock.classList.toggle('mobile-open');
        }
    }

    function initScrollSpy() {
        const dock = document.getElementById('expQuickDock');
        if (!dock) return;
        const buttons = dock.querySelectorAll('.dock-box-btn');
        const cards = document.querySelectorAll('article.exp-card');
        if (!cards.length) return;

        const observer = new IntersectionObserver(entries => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const id = entry.target.id; // e.g. "e1"
                    const num = id.replace('e', '');
                    buttons.forEach(btn => {
                        if (btn.getAttribute('data-exp') === num) {
                            btn.classList.add('active');
                            const pill = document.getElementById('mobileCurrExp');
                            if (pill) pill.textContent = num;
                        } else {
                            btn.classList.remove('active');
                        }
                    });
                }
            });
        }, { threshold: 0.15, rootMargin: '-60px 0px -40% 0px' });

        cards.forEach(card => observer.observe(card));
    }

    // Re-attach scrollspy after rendering
    setTimeout(initScrollSpy, 300);
    </script>
</body>
</html>
